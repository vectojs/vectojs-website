name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - run: bun run check
      - run: bun run test
      - run: bun run format:check
      - run: bun run build

# Production deployment is intentionally manual through `just deploy`; the
# wrapper waits for Wrangler's final completion marker before it terminates.
