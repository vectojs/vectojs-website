<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--diagram-canvas-bg)"/>
      <stop offset="1" stop-color="var(--diagram-canvas-bg)"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--diagram-node-bg)"/>
      <stop offset="1" stop-color="var(--diagram-node-bg)"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="var(--diagram-shadow)" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 86 C150 34 260 144 440 84 C610 28 708 46 900 8 L900 0 L0 0 Z" fill="var(--primary)" opacity="0.16"/>
  <text x="450" y="44" fill="var(--text-muted)" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.6">VECTOJS RUNTIME MAP</text>

  <g filter="url(#soft)">
    <rect x="52" y="154" width="174" height="78" rx="16" fill="url(#node)" stroke="var(--diagram-border)"/>
    <text x="139" y="185" fill="var(--text-color)" font-size="16" font-weight="800" text-anchor="middle">Application state</text>
    <text x="139" y="208" fill="var(--text-muted)" font-size="12" text-anchor="middle">data, events, intent</text>

    <rect x="346" y="126" width="208" height="134" rx="22" fill="var(--diagram-node-bg)" stroke="var(--accent)" stroke-width="2"/>
    <text x="450" y="171" fill="var(--accent-light)" font-size="21" font-weight="900" text-anchor="middle">Virtual Math Tree</text>
    <text x="450" y="198" fill="var(--accent-light)" font-size="13" text-anchor="middle">retained entities · transforms</text>
    <text x="450" y="222" fill="var(--accent-light)" font-size="13" text-anchor="middle">layout · hit-testing · semantics</text>

    <rect x="674" y="78" width="170" height="58" rx="14" fill="url(#node)" stroke="var(--diagram-border)"/>
    <text x="759" y="112" fill="var(--text-strong)" font-size="15" font-weight="800" text-anchor="middle">Math layout</text>

    <rect x="674" y="154" width="170" height="58" rx="14" fill="url(#node)" stroke="var(--diagram-border)"/>
    <text x="759" y="188" fill="var(--text-strong)" font-size="15" font-weight="800" text-anchor="middle">Events + hit tests</text>

    <rect x="674" y="230" width="170" height="58" rx="14" fill="url(#node)" stroke="var(--diagram-border)"/>
    <text x="759" y="264" fill="var(--text-strong)" font-size="15" font-weight="800" text-anchor="middle">Canvas / GPU</text>

    <rect x="674" y="306" width="170" height="58" rx="14" fill="url(#node)" stroke="var(--diagram-border)"/>
    <text x="759" y="340" fill="var(--text-strong)" font-size="15" font-weight="800" text-anchor="middle">Semantic DOM</text>
  </g>

  <g stroke="var(--accent)" stroke-width="2.4" fill="none" marker-end="url(#arrow)" opacity="0.9">
    <path d="M226 193 H336"/>
    <path d="M554 166 C602 142 622 116 664 107"/>
    <path d="M554 185 H664"/>
    <path d="M554 213 C605 227 624 247 664 257"/>
    <path d="M518 260 C568 314 612 332 664 336"/>
  </g>

  <g>
    <rect x="674" y="22" width="170" height="32" rx="16" fill="var(--diagram-node-bg)" stroke="var(--diagram-node-bg)"/>
    <text x="759" y="43" fill="var(--text-faint)" font-size="11" text-anchor="middle">one JS scene graph, many outputs</text>
    <rect x="674" y="384" width="170" height="24" rx="12" fill="var(--diagram-node-bg)" opacity="0.8"/>
    <text x="759" y="400" fill="var(--accent-light)" font-size="10.5" font-weight="700" text-anchor="middle">screen readers · tests · agents</text>
  </g>
</svg>
