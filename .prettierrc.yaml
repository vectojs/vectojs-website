# Prettier's scope is `src/**/*.astro` ONLY, as of the 2026-07-31 toolchain
# migration. oxfmt owns md/ts/js/json/yaml and does not parse Astro at all, so
# this config exists purely to keep the 15 .astro files formatted. The values
# below deliberately mirror .oxfmtrc.json so the two tools cannot disagree on a
# file either could touch. Removing this file makes all 15 .astro files fail
# `format:check` (measured), so it is load-bearing rather than a leftover.
printWidth: 100
tabWidth: 2
useTabs: false
semi: true
singleQuote: true
trailingComma: all
bracketSpacing: true
endOfLine: lf
proseWrap: preserve
htmlWhitespaceSensitivity: css
plugins:
  - prettier-plugin-astro
overrides:
  - files: '*.html'
    options:
      printWidth: 120
  - files: '*.astro'
    options:
      parser: astro
