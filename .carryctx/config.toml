schema_version = 1

[project]
id = "01KYQJGQX9MZHGG8CCDZ004SKX"
name = "vectojs-website"
task_prefix = "CTX"

[git]
main_branch = "main"
branch_template = "carryctx/{task_id}-{slug}"

[session]
stale_after = "2h"
single_active_session_per_agent = true

[task]
single_active_task_per_agent = true
strict_completion = false
list_limit = 200

[context]
default_mode = "compact"
max_events = 10
lookback = "7d"
include_git_status = true

[checkpoint]
require_before_session_end = true
capture_diff_stats = true
capture_untracked_files = true

[output]
color = "auto"
unicode = true
verbose = false

[output.fields]

[agent]

[verification]
# Must match real CI gates (.github/workflows/ci.yml:verify) without
# duplicating lefthook's staged-file fixers. "bun run check" covers
# oxfmt --check + oxlint --deny-warnings; "bun run lint:md" covers
# markdownlint-cli2 on content/**/*.md. Do NOT add a prepare-commit-msg
# hook — it would prefix [CTX-NNNN] and break commitlint.
commands = ["bun run check", "bun run lint:md"]
