<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="var(--primary)"/>
      <stop offset="1" stop-color="var(--diagram-node-bg)"/>
    </radialGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="940" height="560" rx="24" fill="var(--diagram-canvas-bg)"/>
  <text x="470" y="42" fill="var(--text-muted)" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.6">ENGINE CONCEPT MAP</text>

  <g stroke="var(--accent)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" opacity="0.78">
    <path d="M470 244 C342 190 254 150 166 116"/>
    <path d="M470 244 C604 180 692 138 776 112"/>
    <path d="M470 244 C334 236 236 238 142 254"/>
    <path d="M470 244 C608 236 704 238 798 254"/>
    <path d="M470 300 C350 354 250 400 168 438"/>
    <path d="M470 300 C604 356 704 400 786 438"/>
    <path d="M470 324 C470 382 470 420 470 462"/>
  </g>

  <g>
