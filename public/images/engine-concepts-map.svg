    <text x="167" y="130" fill="var(--text-muted)" text-anchor="middle">world ⇄ local mapping</text>

    <rect x="650" y="78" width="252" height="74" rx="16" fill="var(--diagram-node-bg)" stroke="var(--diagram-border)"/>
    <text x="776" y="108" fill="var(--text-strong)" font-size="16" font-weight="900" text-anchor="middle">Semantic projection</text>
    <text x="776" y="130" fill="var(--text-muted)" text-anchor="middle">roles, names, native input</text>

    <rect x="46" y="216" width="192" height="74" rx="16" fill="var(--diagram-node-bg)" stroke="var(--diagram-border)"/>
    <text x="142" y="246" fill="var(--text-strong)" font-size="16" font-weight="900" text-anchor="middle">Hit testing</text>
    <text x="142" y="268" fill="var(--text-muted)" text-anchor="middle">local boxes and curves</text>

