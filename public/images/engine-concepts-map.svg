    <text x="798" y="246" fill="var(--text-strong)" font-size="16" font-weight="900" text-anchor="middle">Cold / hot layout</text>
    <text x="798" y="268" fill="var(--text-muted)" text-anchor="middle">prepare once, reflow fast</text>

    <rect x="44" y="400" width="248" height="76" rx="16" fill="var(--diagram-node-bg)" stroke="var(--diagram-border)"/>
    <text x="168" y="430" fill="var(--text-strong)" font-size="16" font-weight="900" text-anchor="middle">Set-difference text flow</text>
    <text x="168" y="452" fill="var(--text-muted)" text-anchor="middle">wrap around exclusions</text>

    <rect x="648" y="400" width="276" height="76" rx="16" fill="var(--diagram-node-bg)" stroke="var(--diagram-border)"/>
    <text x="786" y="430" fill="var(--text-strong)" font-size="16" font-weight="900" text-anchor="middle">Spring / ODE motion</text>
    <text x="786" y="452" fill="var(--text-muted)" text-anchor="middle">interruptible, continuous animation</text>

    <rect x="342" y="462" width="256" height="64" rx="16" fill="var(--diagram-node-bg)" stroke="var(--diagram-border)"/>
    <text x="470" y="491" fill="var(--text-strong)" font-size="16" font-weight="900" text-anchor="middle">SpatialHashGrid utility</text>
    <text x="470" y="512" fill="var(--text-muted)" text-anchor="middle">app-owned proximity queries</text>
