<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" width="580" height="340" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="580" height="340" rx="12" fill="var(--diagram-node-bg)"/>

  <!-- ── Layer 1: Canvas (bottom) ── -->
  <rect x="30" y="220" width="380" height="88" rx="8" fill="var(--diagram-node-bg)" stroke="var(--diagram-border)" stroke-width="1.5"/>
  <text x="50" y="244" fill="var(--text-faint)" font-size="12" font-weight="600">&lt;canvas&gt;</text>
  <text x="50" y="260" fill="var(--diagram-border)" font-size="11">z-index: 0</text>
  <!-- Rendered component -->
  <rect x="80" y="266" width="100" height="32" rx="6" fill="var(--primary)"/>
  <text x="130" y="287" text-anchor="middle" fill="var(--text-strong)" font-size="12" font-weight="500">Button</text>
  <rect x="200" y="266" width="80" height="32" rx="6" fill="var(--diagram-node-bg)" stroke="var(--diagram-border)" stroke-width="1"/>
  <text x="240" y="287" text-anchor="middle" fill="var(--text-muted)" font-size="12">Input</text>
  <text x="50" y="302" fill="var(--diagram-border)" font-size="10" font-style="italic">canvas-rendered (GPU)</text>

  <!-- ── Layer 2: DOM portal ── -->
  <rect x="30" y="126" width="380" height="78" rx="8" fill="var(--diagram-node-bg)" stroke="var(--diagram-border)" stroke-width="1.5" opacity="0.8"/>
  <text x="50" y="150" fill="var(--text-faint)" font-size="12" font-weight="600">&lt;div&gt; DOM portal layer</text>
  <text x="50" y="166" fill="var(--diagram-border)" font-size="11">z-index: 9</text>
  <text x="50" y="194" fill="var(--diagram-border)" font-size="10" font-style="italic">real DOM elements: video, iframe, rich embeds</text>

  <!-- ── Layer 3: A11y shadow layer (top) ── -->
  <rect x="30" y="28" width="380" height="86" rx="8" fill="var(--diagram-node-bg)" stroke="var(--primary)" stroke-width="2"/>
  <text x="50" y="52" fill="var(--primary-light)" font-size="12" font-weight="600">&lt;div&gt; A11y shadow layer</text>
  <text x="50" y="68" fill="var(--primary)" font-size="11">z-index: 10 · pointer-events: auto · opacity: 0</text>
  <!-- Shadow button -->
  <rect x="80" y="76" width="100" height="28" rx="5" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="130" y="95" text-anchor="middle" fill="var(--primary-light)" font-size="11">&lt;button&gt;</text>
  <!-- Shadow input -->
  <rect x="200" y="76" width="80" height="28" rx="5" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="95" text-anchor="middle" fill="var(--primary-light)" font-size="11">&lt;input&gt;</text>

  <!-- ── Cursor / pointer ── -->
  <polygon points="460,44 460,90 472,80 478,98 484,95 478,76 494,76" fill="var(--text-strong)" stroke="var(--diagram-node-bg)" stroke-width="1.5"/>
  <!-- Pointer label -->
  <text x="460" y="112" fill="var(--text-muted)" font-size="11">user pointer</text>
  <!-- Arrow from pointer down to a11y layer -->
  <line x1="468" y1="96" x2="412" y2="90" stroke="var(--diagram-highlight)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="410,90 420,86 420,94" fill="var(--diagram-highlight)"/>
  <text x="430" y="84" fill="var(--diagram-highlight)" font-size="10">hits here first</text>

  <!-- ── Right side labels / bracket ── -->
  <line x1="418" y1="32" x2="430" y2="32" stroke="var(--diagram-border)" stroke-width="1"/>
  <line x1="430" y1="32" x2="430" y2="302" stroke="var(--diagram-border)" stroke-width="1"/>
  <line x1="418" y1="302" x2="430" y2="302" stroke="var(--diagram-border)" stroke-width="1"/>
  <text x="448" y="140" fill="var(--diagram-border)" font-size="11" transform="rotate(-90 448 168)">canvas parent · position: relative</text>

  <!-- ── Legend ── -->
  <rect x="30" y="318" width="12" height="12" rx="2" fill="none" stroke="var(--primary)" stroke-dasharray="3 2" stroke-width="1.5"/>
  <text x="48" y="329" fill="var(--text-faint)" font-size="11">transparent shadow node (opacity: 0)</text>
</svg>
