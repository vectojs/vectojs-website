<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="900" height="500" rx="24" fill="#080c16"/>
  <text x="450" y="42" fill="#94a3b8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.6">FIT DECISION TREE</text>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M450 126 V172"/>
    <path d="M386 210 C288 236 220 276 174 330"/>
    <path d="M514 210 C612 236 680 276 726 330"/>
    <path d="M726 388 C690 423 632 438 566 440"/>
    <path d="M726 388 C764 418 798 432 840 440"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="295" y="72" width="310" height="74" rx="18" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="105" fill="#e0f2fe" font-size="18" font-weight="900" text-anchor="middle">Is this mostly document content?</text>
    <text x="450" y="128" fill="#93c5fd" font-size="12" text-anchor="middle">prose, SEO, ordinary forms, native selection</text>

    <rect x="62" y="326" width="224" height="80" rx="18" fill="#13202f" stroke="#475569"/>
    <text x="174" y="360" fill="#f8fafc" font-size="17" font-weight="900" text-anchor="middle">Use HTML + CSS</text>
    <text x="174" y="384" fill="#94a3b8" font-size="12" text-anchor="middle">the browser document model wins</text>

    <rect x="600" y="326" width="252" height="80" rx="18" fill="#172554" stroke="#60a5fa"/>
    <text x="726" y="356" fill="#e0f2fe" font-size="17" font-weight="900" text-anchor="middle">Many entities or custom math?</text>
    <text x="726" y="381" fill="#93c5fd" font-size="12" text-anchor="middle">graphs, timelines, games, panels</text>

    <rect x="412" y="424" width="168" height="50" rx="15" fill="#13202f" stroke="#475569"/>
    <text x="496" y="455" fill="#cbd5e1" font-size="15" font-weight="800" text-anchor="middle">Normal app UI</text>

    <rect x="730" y="424" width="128" height="50" rx="15" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
    <text x="794" y="455" fill="#a5f3fc" font-size="15" font-weight="900" text-anchor="middle">VectoJS fits</text>
  </g>

  <g fill="#64748b" font-size="12" font-weight="800">
    <text x="416" y="166" text-anchor="end">yes</text>
    <text x="514" y="166">no</text>
    <text x="302" y="259" text-anchor="middle">yes</text>
    <text x="604" y="259" text-anchor="middle">no</text>
    <text x="642" y="431" text-anchor="middle">no</text>
    <text x="842" y="431" text-anchor="middle">yes</text>
  </g>

  <text x="450" y="246" fill="#64748b" font-size="13" text-anchor="middle">VectoJS is for scene-like UI that still needs accessibility and role-based automation.</text>
</svg>
