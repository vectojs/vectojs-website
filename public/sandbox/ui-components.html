<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="vecto-components"
      content="Text,RichText,Button,Link,Image,Card,Stack,Flow,Input,TextArea,Checkbox,Toggle,Slider,Dropdown,RadioGroup,Tabs,ProgressBar,Overlay,Tooltip,Popover,ContextMenu,VirtualList,TreeView,PanelGroup,Panel,PanelResizeHandle,ScrollView,Modal,Markdown,CodeBlock,Table"
    />
    <script src="/sandbox/no-ff-webgpu.js"></script>
    <title>VectoJS UI component gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #080c16;
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        overflow-x: hidden;
        overflow-y: auto;
      }
      #app {
        position: relative;
        width: 100%;
        min-height: 100vh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        z-index: 10;
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        border: 1px solid rgba(129, 140, 248, 0.32);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #a5b4fc;
        font: 600 11px/1.2 Inter, system-ui, sans-serif;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }
      #status.ready {
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
      }
      #error {
        display: none;
        position: fixed;
        z-index: 20;
        inset: 0;
        padding: 32px;
        background: #080c16;
        color: #fca5a5;
        white-space: pre-wrap;
        font: 13px/1.6 ui-monospace, monospace;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@vectojs/core": "https://esm.sh/@vectojs/core@1.32.0",
          "@vectojs/ui": "https://esm.sh/@vectojs/ui@2.13.0?bundle",
          "@vectojs/markdown": "https://esm.sh/@vectojs/markdown@0.11.0?bundle"
        }
      }
    </script>
  </head>
  <body>
    <div id="status" role="status">Loading @vectojs/ui 0.2.5…</div>
    <div id="app"><canvas id="canvas"></canvas></div>
    <pre id="error"></pre>
    <script type="module">
      import { Entity, Scene } from '@vectojs/core';
      import {
        Button,
        Card,
        Checkbox,
        ContextMenu,
        Dropdown,
        Flow,
        Image,
        Input,
        Link,
        Modal,
        Overlay,
        Panel,
        PanelGroup,
        Popover,
        ProgressBar,
        RadioGroup,
        RichText,
        ScrollView,
        Slider,
        Stack,
        Table,
        Tabs,
        Text,
        TextArea,
        Toggle,
        Tooltip,
        TreeView,
        VirtualList,
      } from '@vectojs/ui';
      import { Markdown } from '@vectojs/markdown';

      const app = document.querySelector('#app');
      const canvas = document.querySelector('#canvas');
      const status = document.querySelector('#status');
      const errorBox = document.querySelector('#error');

      try {
        const viewportWidth = Math.max(320, app.clientWidth);
        const twoColumns = viewportWidth >= 840;
        const gap = 18;
        const outer = 18;
        const cardWidth = twoColumns
          ? Math.min(470, (viewportWidth - outer * 2 - gap) / 2)
          : viewportWidth - outer * 2;
        const inner = cardWidth - 40;

        const cards = [];
        const overlaySetup = [];

        function section(title, subtitle, height) {
          const card = new Card({
            width: cardWidth,
            height,
            radius: 16,
            bg: 'rgba(15,23,42,0.82)',
            border: 'rgba(148,163,184,0.16)',
            label: `${title} component examples`,
          });
          const heading = new Text(title, {
            font: '700 17px Inter, system-ui',
            color: '#f8fafc',
          });
          heading.setPosition(20, 18);
          card.add(heading);
          const note = new Text(subtitle, {
            font: '12px Inter, system-ui',
            color: '#64748b',
            maxWidth: inner,
            lineHeight: 16,
          });
          note.setPosition(20, 45);
          card.add(note);
          cards.push(card);
          return card;
        }

        function caption(text, x, y) {
          return new Text(text, {
            font: '600 10px ui-monospace, monospace',
            color: '#818cf8',
          }).setPosition(x, y);
        }

        const typography = section(
          'Typography & layout',
          'Text, RichText, Link, Stack and Flow inside the Card you are looking at.',
          350,
        );
        typography.add(caption('Text', 20, 82));
        typography.add(
          new Text('Mathematical canvas UI', {
            font: '700 22px Inter, system-ui',
            color: '#e2e8f0',
          }).setPosition(20, 102),
        );
        typography.add(caption('RichText', 20, 142));
        typography.add(
          new RichText(
            [
              { text: 'Mixed ' },
              { text: 'weight', style: { bold: true, color: '#22d3ee' } },
              { text: ', color and ' },
              { text: 'links', style: { href: 'https://vectojs.org' } },
            ],
            { maxWidth: inner, font: '15px Inter, system-ui' },
          ).setPosition(20, 162),
        );
        typography.add(caption('Link', 20, 202));
        typography.add(
          new Link('Open VectoJS documentation ↗', {
            href: 'https://vectojs.org',
          }).setPosition(20, 222),
        );
        const flow = new Flow({ gap: 8, maxWidth: inner });
        ['Flow', 'wraps', 'real', 'Buttons'].forEach((value) =>
          flow.add(
            new Button(value, {
              padding: 8,
              font: '600 12px Inter, system-ui',
              bg: 'rgba(99,102,241,0.2)',
              hoverBg: 'rgba(99,102,241,0.38)',
            }),
          ),
        );
        flow.setPosition(20, 276);
        typography.add(flow);

        const controls = section(
          'Controls & forms',
          'Native shadow inputs stay accessible while every visual is painted on canvas.',
          570,
        );
        const form = new Stack({ direction: 'vertical', gap: 14 });
        form.add(new Input({ width: Math.min(inner, 360), placeholder: 'Input: search commands' }));
        form.add(
          new TextArea({
            width: Math.min(inner, 360),
            height: 72,
            placeholder: 'TextArea: write a note…',
          }),
        );
        form.add(new Checkbox({ checked: true, label: 'Checkbox' }));
        form.add(new Toggle({ checked: true, label: 'Toggle switch' }));
        form.add(new Slider({ min: 0, max: 100, value: 64, width: Math.min(inner, 320) }));
        form.add(new Dropdown(['Dropdown', 'Canvas', 'Accessible'], { width: 180 }));
        form.add(
          new RadioGroup({
            options: [
              { value: 'canvas', label: 'Canvas' },
              { value: 'webgl', label: 'WebGL' },
              { value: 'webgpu', label: 'WebGPU' },
            ],
            value: 'canvas',
            direction: inner > 340 ? 'horizontal' : 'vertical',
            font: '13px Inter, system-ui',
          }),
        );
        form.add(
          new ProgressBar({
            value: 0.72,
            width: Math.min(inner, 320),
            height: 20,
            showText: true,
          }),
        );
        form.add(new Button('Button · Save changes', { width: Math.min(inner, 240) }));
        form.setPosition(20, 84);
        controls.add(form);

        const media = section(
          'Media & data',
          'Image and Table stay small here so each component can be checked in isolation.',
          330,
        );
        media.add(caption('Image', 20, 82));
        media.add(
          new Image('/favicon.svg?v=2', {
            width: 54,
            height: 54,
            alt: 'VectoJS logo',
            radius: 12,
            onLoad: () => scene.markDirty(),
          }).setPosition(20, 102),
        );
        media.add(caption('Table', 92, 82));
        media.add(
          new Table({
            headers: ['Backend', 'Use'],
            rows: [
              ['Canvas', 'UI'],
              ['WebGL', 'Scale'],
              ['WebGPU', 'Compute'],
            ],
            width: Math.min(inner - 72, 330),
            rowHeight: 30,
            font: '12px Inter, system-ui',
          }).setPosition(92, 102),
        );

        const markdownCard = section(
          'Markdown & code',
          'A focused dogfood sample: prose, links, inline code and fenced code are rendered by VectoJS.',
          450,
        );
        markdownCard.add(caption('Markdown + CodeBlock', 20, 82));
        markdownCard.add(
          new Markdown(
            [
              '### Markdown',
              '',
              'Canvas-native **rich content** with [links](https://vectojs.org), inline `code`, and a readable fenced block.',
              '',
              '```ts',
              'const scene = new Scene(canvas);',
              'scene.add(markdown);',
              'scene.start();',
              '```',
            ].join('\n'),
            {
              maxWidth: inner,
              onLinkClick: (href) => window.open(href, '_blank', 'noopener'),
            },
          ).setPosition(20, 106),
        );

        const navigation = section(
          'Navigation & hierarchy',
          'Tabs and TreeView manage selection, hierarchy and their accessibility roles.',
          460,
        );
        const tabA = new Text('Active tab content', {
          font: '14px Inter, system-ui',
          color: '#cbd5e1',
        });
        tabA.setPosition(12, 12);
        const tabB = new Text('Preview content', {
          font: '14px Inter, system-ui',
          color: '#cbd5e1',
        });
        tabB.setPosition(12, 12);
        navigation.add(caption('Tabs', 20, 82));
        navigation.add(
          new Tabs({
            width: inner,
            height: 112,
            tabs: [
              { id: 'code', label: 'Code', content: tabA },
              { id: 'preview', label: 'Preview', content: tabB },
            ],
          }).setPosition(20, 102),
        );
        navigation.add(caption('TreeView', 20, 236));
        navigation.add(
          new TreeView({
            width: inner,
            height: 160,
            nodes: [
              {
                id: 'packages',
                label: 'packages',
                icon: '▣',
                children: [
                  { id: 'core', label: 'core', icon: '◇' },
                  { id: 'ui', label: 'ui', icon: '◇' },
                  { id: 'three', label: 'three', icon: '◇' },
                ],
              },
              { id: 'apps', label: 'apps', icon: '▣' },
            ],
          }).setPosition(20, 256),
        );

        const data = section(
          'Scrolling & large data',
          'ScrollView and VirtualList keep long content responsive and clipped.',
          430,
        );
        const miniScroll = new ScrollView({ width: inner, height: 116 });
        const rows = new Stack({ direction: 'vertical', gap: 8 });
        for (let i = 1; i <= 8; i += 1) {
          rows.add(
            new Text(`ScrollView row ${i}`, {
              font: '13px ui-monospace, monospace',
              color: i % 2 ? '#cbd5e1' : '#818cf8',
            }),
          );
        }
        miniScroll.add(rows);
        miniScroll.setPosition(20, 102);
        data.add(caption('ScrollView', 20, 82));
        data.add(miniScroll);
        data.add(caption('VirtualList · 1,000 logical rows', 20, 244));
        data.add(
          new VirtualList({
            items: Array.from({ length: 1000 }, (_, index) => `Virtual row ${index + 1}`),
            renderItem: (item, index) =>
              new Text(item, {
                font: '12px ui-monospace, monospace',
                color: index % 2 ? '#94a3b8' : '#e2e8f0',
              }),
            estimatedRowHeight: 24,
            width: inner,
            height: 132,
          }).setPosition(20, 264),
        );

        const panels = section(
          'Resizable panels',
          'PanelGroup contains Panel viewports and a real draggable PanelResizeHandle.',
          270,
        );
        const panelGroup = new PanelGroup({
          direction: 'horizontal',
          width: inner,
          height: 130,
          handleSize: 6,
        });
        const leftPanel = new Panel({ minSize: 90, defaultSize: 0.38 });
        leftPanel.setContent(
          new Card({
            width: 150,
            height: 130,
            radius: 8,
            bg: 'rgba(99,102,241,0.14)',
            label: 'Navigation panel',
          }),
        );
        const rightPanel = new Panel({ minSize: 120 });
        rightPanel.setContent(
          new Card({
            width: 240,
            height: 130,
            radius: 8,
            bg: 'rgba(34,211,238,0.08)',
            label: 'Content panel',
          }),
        );
        panelGroup.addPanel(leftPanel).addPanel(rightPanel);
        panelGroup.setPosition(20, 102);
        panels.add(caption('Panel · PanelGroup · PanelResizeHandle', 20, 82));
        panels.add(panelGroup);

        const overlays = section(
          'Overlays & transient UI',
          'Hover or click the launchers. Each panel is constrained inside the gallery viewport.',
          460,
        );
        const launcherStack = new Stack({ direction: 'vertical', gap: 12 });
        const tooltipTarget = new Button('Hover · Tooltip', { width: Math.min(inner, 220) });
        const popoverTarget = new Button('Click · Popover', { width: Math.min(inner, 220) });
        const contextTarget = new Button('Click · ContextMenu', { width: Math.min(inner, 220) });
        const overlayTarget = new Button('Click · Overlay base', { width: Math.min(inner, 220) });
        const modalTarget = new Button('Open · Modal', { width: Math.min(inner, 220) });
        launcherStack.add(tooltipTarget);
        launcherStack.add(popoverTarget);
        launcherStack.add(contextTarget);
        launcherStack.add(overlayTarget);
        launcherStack.add(modalTarget);
        launcherStack.setPosition(20, 96);
        overlays.add(launcherStack);

        class PreviewOverlay extends Overlay {
          constructor() {
            super({ width: 154, height: 34, placement: 'right', offset: 8 });
          }
          render(renderer) {
            renderer.beginPath();
            renderer.roundRect(0, 0, this.width, this.height, 8);
            renderer.fill('rgba(49,46,129,0.97)');
            renderer.stroke('rgba(165,180,252,0.5)', 1);
            renderer.fillText(
              'Overlay base class',
              12,
              21,
              '600 12px Inter, system-ui',
              '#e0e7ff',
            );
          }
        }

        overlaySetup.push((scene) => {
          const tooltip = new Tooltip({
            target: tooltipTarget,
            content: 'Tooltip is rendered by VectoJS',
            delay: 100,
          });
          const popover = new Popover({
            target: popoverTarget,
            width: 210,
            height: 82,
            placement: 'right',
            bg: 'rgba(15,15,30,0.99)',
          });
          popover.add(
            new Text('Popover content', {
              font: '600 13px Inter, system-ui',
              color: '#e2e8f0',
            }).setPosition(14, 16),
          );
          popover.add(
            new Text('Click the launcher to close.', {
              font: '11px Inter, system-ui',
              color: '#94a3b8',
              maxWidth: 176,
            }).setPosition(14, 40),
          );
          const menu = new ContextMenu({
            width: 220,
            items: [
              { label: 'Copy', icon: '⧉', shortcut: 'Ctrl+C' },
              { label: 'Inspect', icon: '◇' },
              { separator: true },
              { label: 'Disabled', disabled: true },
            ],
          });
          const previewOverlay = new PreviewOverlay();
          const modal = new Modal('Modal preview', {
            width: scene.width,
            height: scene.height,
            modalWidth: Math.min(400, scene.width - 40),
            modalHeight: 240,
          });

          scene.add(tooltip);
          scene.add(popover);
          scene.overlayRoot.add(menu);
          scene.add(previewOverlay);
          contextTarget.on('click', () => {
            const bounds = contextTarget.getWorldBounds();
            const cardBounds = overlays.getWorldBounds();
            const x = Math.min(
              cardBounds.x + cardBounds.width - menu.width - 12,
              bounds.x + bounds.width + 12,
            );
            const y = Math.min(cardBounds.y + cardBounds.height - menu.height - 12, bounds.y);
            menu.showAtPoint(x, y);
          });
          overlayTarget.on('click', () => previewOverlay.showAt(overlayTarget));
          modalTarget.on('click', () => scene.showOverlay(modal));
        });

        const columnHeights = twoColumns ? [outer, outer] : [outer];
        cards.forEach((card) => {
          const column = columnHeights.indexOf(Math.min(...columnHeights));
          card.setPosition(outer + column * (cardWidth + gap), columnHeights[column]);
          columnHeights[column] += card.height + gap;
        });
        const documentHeight = Math.max(...columnHeights) + outer;
        app.style.height = `${documentHeight}px`;
        canvas.width = viewportWidth;
        canvas.height = documentHeight;

        const scene = new Scene(canvas, { renderMode: 'onDemand', maxFPS: 60 });
        cards.forEach((card) => scene.add(card));
        overlaySetup.forEach((setup) => setup(scene));
        scene.start();
        requestAnimationFrame(() => {
          scene.resize(viewportWidth, documentHeight);
          scene.markDirty();
          status.classList.add('ready');
          window.parent?.postMessage({ type: 'vecto-sandbox-ready', id: 'ui-components' }, '*');
        });
        // onDemand only repaints on markDirty(); a canvas's backing store can
        // be silently cleared while its tab is back/forward-cached (bfcache),
        // which this page's own JS/scene state survives untouched, so nothing
        // else would ever trigger a redraw after the browser Back button
        // restores it.
        window.addEventListener('pageshow', (e) => {
          if (e.persisted) scene.markDirty();
        });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') scene.markDirty();
        });
      } catch (error) {
        status.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.textContent = error instanceof Error ? `${error.message}\n\n${error.stack ?? ''}` : String(error);
        throw error;
      }
    </script>
  </body>
</html>
