<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VectoJS Button sandbox</title>
    <link rel="stylesheet" href="/sandbox/ui/shared.css" />
    <script type="importmap">
      {
        "imports": {
          "@vectojs/core": "https://esm.sh/@vectojs/core@1.5.0",
          "@vectojs/ui": "https://esm.sh/@vectojs/ui@1.7.1?bundle"
        }
      }
    </script>
  </head>
  <body>
    <div id="status" role="status">Loading Button demo…</div>
    <div id="app"><canvas id="canvas"></canvas></div>
    <pre id="error"></pre>
    <script type="module">
      import { Button, Card, Flow, RichText, Stack, Text } from '@vectojs/ui';
      import { commonCardWidth, createSandbox } from '/sandbox/ui/shared.js';

      let card;
      let title;
      let summary;
      let stateText;
      let flow;

      try {
        const sandbox = createSandbox({
          id: 'ui-button',
          height: 420,
          onResize(width) {
            if (!card) return;
            const cardWidth = commonCardWidth(width);
            card.width = cardWidth;
            card.setPosition((width - cardWidth) / 2, 24);
            title.setPosition(24, 24);
            summary.setMaxWidth(cardWidth - 48);
            summary.setPosition(24, 66);
            flow.maxWidth = cardWidth - 48;
            flow.setPosition(24, 150);
            flow.layout();
            stateText.setPosition(24, 270);
          },
        });

        const { scene } = sandbox;
        const cardWidth = commonCardWidth(scene.width);
        let count = 0;

        card = new Card({
          width: cardWidth,
          height: 360,
          radius: 18,
          bg: 'rgba(15,23,42,0.88)',
          border: 'rgba(148,163,184,0.18)',
          label: 'Button demo card',
        });
        card.setPosition((scene.width - cardWidth) / 2, 24);

        title = new Text('Button', { font: '800 30px Inter, system-ui', color: '#f8fafc' });
        summary = new RichText(
          [
            { text: 'Hover updates the canvas state immediately, while ' },
            { text: 'click', style: { bold: true, color: '#67e8f9' } },
            { text: ' routes through the same semantic button used by Playwright.' },
          ],
          { maxWidth: cardWidth - 48, font: '16px Inter, system-ui', color: '#94a3b8' },
        );

        flow = new Flow({ gap: 12, maxWidth: cardWidth - 48 });
        stateText = new Text('Clicked 0 times', {
          font: '600 16px ui-monospace, monospace',
          color: '#c4b5fd',
        });

        const updateCount = () => {
          count += 1;
          stateText.setText(`Clicked ${count} time${count === 1 ? '' : 's'}`);
          scene.markDirty();
        };

        flow.add(
          new Button('Primary action', {
            width: 180,
            onClick: updateCount,
          }),
        );
        flow.add(
          new Button('Secondary', {
            width: 140,
            bg: 'rgba(30,41,59,0.95)',
            hoverBg: 'rgba(51,65,85,1)',
            onClick: updateCount,
          }),
        );
        flow.add(
          new Button('Compact', {
            padding: 8,
            font: '700 13px Inter, system-ui',
            bg: 'rgba(99,102,241,0.24)',
            hoverBg: 'rgba(99,102,241,0.44)',
            onClick: updateCount,
          }),
        );

        card.add(title.setPosition(24, 24));
        card.add(summary.setPosition(24, 66));
        card.add(flow.setPosition(24, 150));
        card.add(stateText.setPosition(24, 270));
        scene.add(card);
        sandbox.ready();
      } catch (error) {
        document.querySelector('#error').style.display = 'block';
        document.querySelector('#error').textContent =
          error instanceof Error ? `${error.message}\n\n${error.stack ?? ''}` : String(error);
        throw error;
      }
    </script>
  </body>
</html>
