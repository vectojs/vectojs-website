<!doctype html>
<html lang="{% if lang %}{{ lang }}{% else %}en{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <!-- Inline theme script to prevent flash -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('vecto-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored :
          (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  
  <!-- Minimal CSS for skeleton -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      overflow: auto;
    }
    html[data-theme='light'], html[data-theme='light'] body {
      background-color: #f8fafc;
    }
    #vecto-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
  
  {% block extra_head %}{% endblock extra_head %}
</head>
<body>
  <canvas id="vecto-canvas"></canvas>
  
  <script id="page-data" type="application/json">
{
  "config": {
    "title": {{ config.title | json_encode() | safe }},
    "description": {{ config.description | json_encode() | safe }},
    "github": {{ config.extra.github | json_encode() | safe }},
    "gallery": {{ config.extra.gallery | json_encode() | safe }}
  },
  "data": {% block page_data %}{}{% endblock page_data %}
}
  </script>
  
  <script type="module" src="/js/index.js"></script>
</body>
</html>
